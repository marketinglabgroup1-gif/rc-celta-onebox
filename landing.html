    <script>
        const form = document.getElementById('avisame-form');
        const status = document.getElementById('form-status');

        function showStatus(message, kind) {
            status.textContent = message;
            status.classList.remove('form-status--success', 'form-status--error');
            status.classList.add(kind === 'success' ? 'form-status--success' : 'form-status--error');
            status.hidden = false;
        }

        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                showStatus('Por favor, completa todos los campos antes de enviar.', 'error');
                return;
            }

            const selected = form.grada.selectedOptions[0];
            const payload = {
                name: form.name.value.trim(),
                surname: form.surname.value.trim(),
                email: form.email.value.trim(),
                gradaId: form.grada.value,
                gradaLabel: selected ? selected.textContent : '',
                sessionId: form.session_id.value,
                eventId: form.event_id.value,
                privacy: form.privacy.checked,
            };

            const originalLabel = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando…';

            try {
                const res = await fetch('/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const result = await res.json().catch(() => ({}));

                if (res.ok && result.ok) {
                    showStatus('¡Listo! Te avisaremos en cuanto se abran las entradas.', 'success');
                    form.reset();
                } else {
                    showStatus(result.error || 'No se pudo completar el registro. Inténtalo de nuevo.', 'error');
                }
            } catch (err) {
                showStatus('No se pudo conectar con el servidor. Inténtalo de nuevo.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalLabel;
            }
        });
    </script>
